name: Run Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:

  test:

    env:
      BASE_URL: https://condominio-marketplace.netlify.app

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven local repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install Maven dependencies (no tests)
        run: mvn -B clean install -DskipTests

      - name: Install required system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install common Playwright dependencies; try best-effort for libvpx flavor
          sudo apt-get install -y \
            libwoff1 \
            libevent-2.1-7 \
            libopus0 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libsecret-1-0 \
            libhyphen0 \
            libx264-dev || true

          # libvpx version varies between Ubuntu images. Prefer libvpx7, fallback to libvpx6 or libvpx-dev
          if apt-cache show libvpx7 >/dev/null 2>&1; then
            sudo apt-get install -y libvpx7
          elif apt-cache show libvpx6 >/dev/null 2>&1; then
            sudo apt-get install -y libvpx6
          else
            sudo apt-get install -y libvpx-dev || true
          fi

      - name: Install Playwright
        run: mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

      - name: Set up Node.js (for frontend)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install frontend deps (if present)
        run: |
          if [ -d "frontend/vite-project" ]; then
            echo "Installing frontend dependencies (frontend/vite-project)..."
            cd frontend/vite-project
            npm ci
          else
            echo "No frontend/vite-project directory found; skipping frontend install"
          fi

      - name: Start frontend (background) if present
        run: |
          if [ -d "frontend/vite-project" ]; then
            echo "Starting frontend (frontend/vite-project) in background..."
            cd frontend/vite-project
            npm run dev &>/dev/null &
          else
            echo "No frontend/vite-project directory found; skipping frontend start"
          fi

      - name: Wait for frontend to be ready
        run: |
          if [ -d "frontend" ]; then
            npx wait-on ${BASE_URL} --timeout 60000
          else
            echo "No frontend directory; nothing to wait for"
          fi

      - name: Run tests (headless)
        run: mvn -B clean test -Dplaywright.headless=true -Dplaywright.enableRecording=false -DbaseUrl=${BASE_URL}

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results

      - name: Install Allure CLI
        if: always()
        run: |
          npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate target/allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report